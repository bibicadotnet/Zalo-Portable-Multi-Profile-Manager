name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nhập phiên bản để phát hành (ví dụ: v1.0.0)'
        required: true
        default: 'v1.0.0'


jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --no-bundle

      - name: Create Release and Upload Assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version || 'v1.0.0' }}
        run: |
          # Create release if it doesn't exist, or update assets if it does
          gh release create "$env:VERSION" --title "Zalo Portable $env:VERSION" --notes "Release build for Windows." --draft=false --prerelease=false --clobber src-tauri/target/release/*.exe
